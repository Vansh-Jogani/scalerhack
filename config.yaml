server:
  host: "0.0.0.0"
  port: 8000

mapbox:
  style: "mapbox://styles/mapbox/dark-v11"

simulation:
  tick_rate_hz: 10
  default_scenario: "sim/scenarios/fire.json"
  scenarios:
    fire:               "sim/scenarios/fire.json"
    flood:              "sim/scenarios/flood.json"
    structural_collapse: "sim/scenarios/structural_collapse.json"
    industrial_hazard:  "sim/scenarios/industrial_hazard.json"
    maritime_sar:       "sim/scenarios/maritime_sar.json"

models:
  agent1: "claude-haiku-4-5-20251001"
  agent2: "claude-haiku-4-5-20251001"
  agent3_endpoint: "http://localhost:11434/api/chat"
  agent3_model: "llama3.1:8b"
